name: "Frogbot Scan Pull Request"
on:
  pull_request_target:
    types: [ opened, synchronize ]
permissions:
  pull-requests: write
  contents: read
jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    # Skip Frogbot's own fix PRs. A PR is skipped only when all three are true: its branch starts with "frogbot-",
    # its head is in this repository (not a fork), and its author is the Frogbot account. Any other user who pushes a
    # "frogbot-*" branch is scanned. The Frogbot account is the repository variable FROGBOT_BOT_LOGIN, the owner of the
    # FROGBOT_GIT_TOKEN secret. It defaults to github-actions[bot], the author of PRs opened with GITHUB_TOKEN.
    if: ${{ !(startsWith(github.event.pull_request.head.ref, 'frogbot-') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == (vars.FROGBOT_BOT_LOGIN || 'github-actions[bot]')) }}
    # A pull request needs to be approved, before Frogbot scans it. Any GitHub user who is associated with the
    # "frogbot" GitHub environment can approve the pull request to be scanned.
    environment: frogbot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # actions/checkout refuses to check out fork PR code from a pull_request_target workflow unless this is set.
          # The "frogbot" environment above requires an approval before this job runs, so fork code is scanned
          # only after a trusted user has reviewed the pull request.
          allow-unsafe-pr-checkout: true

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      - uses: jfrog/frogbot@v2
        env:
          # [Mandatory]
          # JFrog platform URL (This functionality requires version 3.29.0 or above of Xray)
          JF_URL: ${{ secrets.FROGBOT_URL }}

          # [Mandatory if JF_USER and JF_PASSWORD are not provided]
          # JFrog access token with 'read' permissions on Xray service
          JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}

          # [Mandatory]
          # The GitHub token automatically generated for the job
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
