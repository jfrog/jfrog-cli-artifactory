name: "Frogbot Scan and Fix"
on:
  schedule:
    # The repository will be scanned once a day at 00:00 GMT.
    - cron: "0 0 * * *"
permissions:
  contents: write
  pull-requests: write
  security-events: write
jobs:
  create-fix-pull-requests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The repository scanning will be triggered periodically on the following branches.
        branch: [ "main" ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      # Record the Frogbot PRs that are already open, so that only PRs raised by this run are touched later.
      - name: Snapshot existing Frogbot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          # Frogbot names its fix branches "frogbot-<dependency>-<hash>".
          gh pr list --state open --base "$BASE_BRANCH" --limit 200 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("frogbot-")) | .number' \
            | sort > "$RUNNER_TEMP/frogbot-prs-before.txt"

      - uses: jfrog/frogbot@v2
        env:
          # [Mandatory]
          # JFrog platform URL
          JF_URL: ${{ secrets.FROGBOT_URL }}

          # [Mandatory if JF_USER and JF_PASSWORD are not provided]
          # JFrog access token with 'read' permissions on Xray service
          JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}

          # [Mandatory]
          # The GitHub token automatically generated for the job
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Label and enable auto-merge only on the PRs this run raised (open now, but not in the snapshot).
      - name: Label new Frogbot PRs and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          gh pr list --state open --base "$BASE_BRANCH" --limit 200 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("frogbot-")) | .number' \
            | sort > "$RUNNER_TEMP/frogbot-prs-after.txt"
          new_prs=$(comm -13 "$RUNNER_TEMP/frogbot-prs-before.txt" "$RUNNER_TEMP/frogbot-prs-after.txt")
          if [ -z "$new_prs" ]; then
            echo "Frogbot raised no new pull requests."
            exit 0
          fi
          for pr in $new_prs; do
            echo "Preparing PR #$pr"
            gh pr edit "$pr" --add-label "ignore for release" --add-label "safe to test"
            gh pr merge "$pr" --auto --squash
          done
