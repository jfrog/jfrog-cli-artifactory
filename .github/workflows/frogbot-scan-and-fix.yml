name: "Frogbot Scan and Fix"
on:
  schedule:
    # The repository will be scanned once a day at 00:00 GMT.
    - cron: "0 0 * * *"
permissions:
  contents: write
  pull-requests: write
  security-events: write
jobs:
  create-fix-pull-requests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The repository scanning will be triggered periodically on the following branches.
        branch: [ "main" ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      - uses: jfrog/frogbot@v2
        env:
          # [Mandatory]
          # JFrog platform URL
          JF_URL: ${{ secrets.FROGBOT_URL }}

          # [Mandatory if JF_USER and JF_PASSWORD are not provided]
          # JFrog access token with 'read' permissions on Xray service
          JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}

          # [Mandatory]
          # The GitHub token automatically generated for the job
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prepare the pull requests that Frogbot opened (or already has open) against this branch:
      # label them and enable auto-merge. All commands are safe to re-run.
      - name: Label Frogbot PRs and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          # Frogbot names its fix branches "frogbot-<dependency>-<hash>".
          prs=$(gh pr list --state open --base "$BASE_BRANCH" --limit 100 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("frogbot-")) | .number')
          for pr in $prs; do
            echo "Preparing PR #$pr"
            gh pr edit "$pr" --add-label "ignore for release" --add-label "safe to test"
            gh pr merge "$pr" --auto --squash
          done
