name: "Frogbot Scan and Fix"
on:
  schedule:
    # The repository will be scanned once a day at 00:00 GMT.
    - cron: "0 0 * * *"
permissions:
  contents: write
  pull-requests: write
  security-events: write
jobs:
  create-fix-pull-requests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The repository scanning will be triggered periodically on the following branches.
        branch: [ "main" ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Go with cache
        uses: jfrog/.github/actions/install-go-with-cache@main

      # Frogbot skips a fix when its branch already exists on the remote, so every "frogbot-*" branch
      # that appears during this run was pushed by this run. Record the existing ones first.
      - name: Snapshot existing Frogbot branches
        run: |
          set -euo pipefail
          git ls-remote --heads origin 'refs/heads/frogbot-*' \
            | sed 's#.*refs/heads/##' | sort > "$RUNNER_TEMP/frogbot-branches-before.txt"

      - uses: jfrog/frogbot@v2
        env:
          # [Mandatory]
          # JFrog platform URL
          JF_URL: ${{ secrets.FROGBOT_URL }}

          # [Mandatory if JF_USER and JF_PASSWORD are not provided]
          # JFrog access token with 'read' permissions on Xray service
          JF_ACCESS_TOKEN: ${{ secrets.FROGBOT_ACCESS_TOKEN }}

          # [Mandatory]
          # The GitHub token automatically generated for the job
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Label and enable auto-merge only on the PRs for branches this run pushed.
      # Runs even if Frogbot failed part-way, since it may already have opened some PRs.
      - name: Label new Frogbot PRs and enable auto-merge
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/frogbot-branches-before.txt"
          if [ ! -f "$before" ]; then
            echo "::warning::No branch snapshot found, skipping labeling."
            exit 0
          fi
          git ls-remote --heads origin 'refs/heads/frogbot-*' \
            | sed 's#.*refs/heads/##' | sort > "$RUNNER_TEMP/frogbot-branches-after.txt"
          new_branches=$(comm -13 "$before" "$RUNNER_TEMP/frogbot-branches-after.txt")
          if [ -z "$new_branches" ]; then
            echo "Frogbot pushed no new branches."
            exit 0
          fi
          while IFS= read -r branch; do
            pr=$(gh pr list --state open --base "$BASE_BRANCH" --head "$branch" --json number --jq '.[0].number // empty')
            if [ -z "$pr" ]; then
              echo "::warning::No open PR found for branch $branch"
              continue
            fi
            echo "Preparing PR #$pr ($branch)"
            gh pr edit "$pr" --add-label "ignore for release" --add-label "safe to test"
            gh pr merge "$pr" --auto --squash
          done <<< "$new_branches"
